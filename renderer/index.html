<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GrabTube — Premium Video Downloader</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- ═══ CUSTOM TITLE BAR ═══ -->
  <header class="titlebar" id="titlebar">
    <div class="titlebar-drag">
      <div class="titlebar-logo">
        <svg class="logo-icon" viewBox="0 0 32 32" width="22" height="22">
          <defs>
            <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#6c5ce7"/>
              <stop offset="100%" stop-color="#00cec9"/>
            </linearGradient>
          </defs>
          <rect width="32" height="32" rx="8" fill="url(#logoGrad)"/>
          <polygon points="13,9 13,23 24,16" fill="white"/>
        </svg>
        <span class="titlebar-title">GrabTube</span>
      </div>
    </div>
    <div class="titlebar-controls">
      <button id="btn-minimize" class="titlebar-btn" aria-label="Minimize">
        <svg width="12" height="12" viewBox="0 0 12 12"><rect y="5" width="12" height="2" rx="1" fill="currentColor"/></svg>
      </button>
      <button id="btn-maximize" class="titlebar-btn" aria-label="Maximize">
        <svg width="12" height="12" viewBox="0 0 12 12"><rect x="1" y="1" width="10" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
      </button>
      <button id="btn-close" class="titlebar-btn titlebar-btn-close" aria-label="Close">
        <svg width="12" height="12" viewBox="0 0 12 12"><path d="M2 2l8 8M10 2l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
    </div>
  </header>

  <!-- ═══ MAIN CONTENT ═══ -->
  <main class="app-container">
    <!-- ─── Status Banner ─── -->
    <div id="app-status-banner" class="status-banner hidden">
      <div class="status-spinner"></div>
      <span id="app-status-text"></span>
    </div>

    <!-- ─── URL INPUT SECTION ─── -->
    <section class="input-section" id="input-section">
      <div class="section-header">
        <h1 class="section-title">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
          Paste Video URL
        </h1>
      </div>

      <div class="url-input-wrapper">
        <div class="url-input-container">
          <svg class="url-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <textarea id="url-input" class="url-input" placeholder="Paste YouTube URL(s) here — one per line for batch downloads..." rows="2" spellcheck="false"></textarea>
          <button id="btn-paste" class="btn-icon btn-paste" title="Paste from clipboard">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/></svg>
          </button>
        </div>
        <button id="btn-fetch" class="btn-primary btn-fetch" disabled>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
          <span>Fetch Info</span>
        </button>
      </div>

      <!-- Drag & Drop Zone -->
      <div id="drop-zone" class="drop-zone">
        <div class="drop-zone-content">
          <svg class="drop-zone-icon" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          <p class="drop-zone-text">Drag & drop a URL or video file here</p>
          <p class="drop-zone-hint">or paste a link above</p>
        </div>
      </div>
    </section>

    <!-- ─── VIDEO PREVIEW ─── -->
    <section id="video-preview" class="video-preview hidden">
      <div class="preview-card glass-card">
        <div class="preview-thumbnail-wrapper">
          <img id="preview-thumbnail" class="preview-thumbnail" src="" alt="Video thumbnail">
          <span id="preview-duration" class="preview-duration">0:00</span>
        </div>
        <div class="preview-info">
          <h2 id="preview-title" class="preview-title">Video Title</h2>
          <p id="preview-channel" class="preview-channel">Channel Name</p>
          <div class="preview-meta">
            <span id="preview-views" class="meta-badge">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              <span>0 views</span>
            </span>
          </div>
        </div>
        <button id="btn-clear-preview" class="btn-icon btn-clear" title="Clear">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
    </section>

    <!-- ─── OPTIONS PANEL ─── -->
    <section id="options-panel" class="options-panel hidden">
      <div class="options-row">
        <!-- Format Selector -->
        <div class="option-group">
          <label class="option-label" for="format-select">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
            Quality
          </label>
          <select id="format-select" class="select-input">
            <option value="best-mp4">Best Quality (MP4)</option>
          </select>
        </div>

        <!-- Output Folder -->
        <div class="option-group option-group-folder">
          <label class="option-label">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
            Save to
          </label>
          <div class="folder-selector">
            <span id="folder-path" class="folder-path" title="">~/Downloads/GrabTube</span>
            <button id="btn-change-folder" class="btn-icon btn-small" title="Change folder">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
            </button>
            <button id="btn-open-folder" class="btn-icon btn-small" title="Open folder">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
            </button>
          </div>
        </div>
      </div>

      <!-- Toggle Options -->
      <div class="toggles-row">
        <label class="toggle-label" for="toggle-subtitles">
          <div class="toggle-switch">
            <input type="checkbox" id="toggle-subtitles" class="toggle-input">
            <span class="toggle-slider"></span>
          </div>
          <span>Subtitles</span>
        </label>
        <label class="toggle-label" for="toggle-audio-only">
          <div class="toggle-switch">
            <input type="checkbox" id="toggle-audio-only" class="toggle-input">
            <span class="toggle-slider"></span>
          </div>
          <span>Audio Only (MP3)</span>
        </label>
        <label class="toggle-label" for="toggle-metadata">
          <div class="toggle-switch">
            <input type="checkbox" id="toggle-metadata" class="toggle-input" checked>
            <span class="toggle-slider"></span>
          </div>
          <span>Embed Metadata</span>
        </label>
      </div>

      <!-- Download Button -->
      <div class="download-action">
        <button id="btn-download" class="btn-download" disabled>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          <span>Download</span>
        </button>
      </div>
    </section>

    <!-- ─── DOWNLOAD QUEUE ─── -->
    <section id="download-queue" class="download-queue">
      <div class="queue-header">
        <h2 class="section-title section-title-sm">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Downloads
        </h2>
        <span id="queue-count" class="queue-count">0 items</span>
      </div>
      <div id="queue-list" class="queue-list">
        <!-- Empty state -->
        <div id="queue-empty" class="queue-empty">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="0.3">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          <p>No downloads yet</p>
          <p class="queue-empty-hint">Paste a URL above to get started</p>
        </div>
      </div>
    </section>
  </main>

  <!-- ═══ TOAST NOTIFICATIONS ═══ -->
  <div id="toast-container" class="toast-container"></div>

  <script src="app.js"></script>
</body>
</html>
