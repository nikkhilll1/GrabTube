name: Build & Release GrabTube

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build Electron app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --x64 --publish never

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GrabTube-Windows-Setup
          path: dist/*.exe
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          name: GrabTube ${{ github.ref_name }}
          body: |
            ## 🎬 GrabTube ${{ github.ref_name }}
            
            Premium YouTube Video Downloader — Download videos in highest quality with one click.
            
            ### 📥 Installation
            1. Download `GrabTube-Setup-*.exe` below
            2. Run the installer
            3. Launch GrabTube from your desktop!
            
            ### ✨ Features
            - One-click video & audio downloads
            - Multiple format support (MP4, MP3, WebM)
            - Batch downloading
            - Real-time progress tracking
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
